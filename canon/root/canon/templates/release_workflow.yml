# Canonical CCSDD release workflow - deployed into the target repo
# by canon/bin/setup_repo.sh.
#
# Release-on-Merge serialization: every merged release/v* PR
# finalizes the tag+release HERE, serialized by the concurrency
# group - two merges can never race the version/tag order.
name: release
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout the actual merge commit on main - never head.sha:
      # the PR head may be stale or already deleted by the time the
      # closed event fires; the tag must sit on the landed merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # Branch names land in env, never inline - no run-script
          # interpolation of untrusted refs. The -r<sha> uniqueness
          # suffix repo_release.sh appends to collision-renamed
          # release branches is stripped before tagging.
          TAG="${HEAD_REF#release/}"
          TAG="${TAG%%-r*}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "unexpected release ref '$HEAD_REF' - refusing to tag" >&2
            exit 1
          fi
          # Provenance, mirrored from repo_release.sh: only a merge
          # commit whose subject proves a release branch landed may
          # mint a tag - a hand-crafted release/v* PR title alone
          # must never reach the tag namespace.
          SUBJ=$(git log -1 --format=%s "$MERGE_SHA" || true)
          VER="${TAG#v}"
          if printf '%s' "$SUBJ" | grep -qE "^release:[[:space:]]*v[0-9]+\.[0-9]+\.[0-9]+([[:space:]]*\(#[0-9]+\))?$" \
             || printf '%s' "$SUBJ" | grep -qE "^Merge[[:space:]]+pull[[:space:]]+request[[:space:]]+#[0-9]+[[:space:]]+from[[:space:]]+[^[:space:]]+/release/v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9a-zA-Z]+)?$" \
             || printf '%s' "$SUBJ" | grep -qE "^Merge[[:space:]]+branch[[:space:]]+'release/v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9a-zA-Z]+)?'([[:space:]]+into[[:space:]]+[^[:space:]]+)?$"; then
            :
          else
            echo "merge subject '$SUBJ' is not a canonical release form - refusing to tag" >&2
            exit 1
          fi
          # The version source ON the merge commit must equal the tag
          # version - provenance over the branch name alone. canon/ is
          # gitignored in deployed projects, so canon/bin/repo_version_at.sh
          # does NOT exist on a CI checkout: the autodetect logic is
          # inlined here (same priority: pyproject.toml [project],
          # package.json, Cargo.toml [package], VERSION, setup.cfg
          # [metadata]). A repo-declared canon/project.json version
          # source is resolved by the local repo_release.sh gate
          # before this workflow ever runs.
          V=$(python3 - <<'PYEOF' || true
          import json, os, re
          def read(p):
              try: return open(p, encoding="utf-8", errors="replace").read()
              except OSError: return None
          body = read("pyproject.toml")
          if body:
              m = re.search(r"(?ms)^\[project\](?:(?!^\[).)*?^\s*version\s*=\s*[\"']([^\"']+)", body)
              if m: print(m.group(1)); raise SystemExit(0)
          body = read("package.json")
          if body:
              try:
                  v = json.loads(body).get("version")
                  if v: print(v); raise SystemExit(0)
              except Exception: pass
          body = read("Cargo.toml")
          if body:
              m = re.search(r"(?ms)^\[package\](?:(?!^\[).)*?^\s*version\s*=\s*[\"']([^\"']+)", body)
              if m: print(m.group(1)); raise SystemExit(0)
          body = read("VERSION")
          if body:
              print(body.strip().splitlines()[0].strip()); raise SystemExit(0)
          body = read("setup.cfg")
          if body:
              m = re.search(r"(?ms)^\[metadata\](?:(?!^\[).)*?^\s*version\s*=\s*(\S+)", body)
              if m: print(m.group(1)); raise SystemExit(0)
          PYEOF
          )
          # No standard version file on this checkout - the project
          # uses a custom source. Two resolutions, in order:
          #  (a) a TRACKED canon/project.json with a declared
          #      version.file / version.regex (custom repos where the
          #      canon layer ships inside the repo);
          #  (b) diff fallback: the merge commit carries the release
          #      bump - the unique non-release-artifact file it
          #      touches is the version source, and its added line
          #      holds the new version (mirrors repo_version_set.sh
          #      custom-file logic).
          if [ -z "${V:-}" ] && [ -x canon/version_source.sh ]; then
            V=$(canon/version_source.sh 2>/dev/null || true)
          fi
          if [ -z "${V:-}" ] && [ -f canon/project.json ]; then
            V=$(python3 - <<'PYEOF' || true
          import json, re
          try:
              pj = json.load(open("canon/project.json", encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          vf = (pj.get("version") or {}).get("file")
          rx = (pj.get("version") or {}).get("regex") or r"([0-9]+\.[0-9]+\.[0-9]+)"
          if vf:
              try:
                  m = re.search(rx, open(vf, encoding="utf-8", errors="replace").read())
                  if m: print(m.group(1) if m.groups() else m.group(0))
              except OSError:
                  pass
          PYEOF
            )
          fi
          if [ -z "${V:-}" ]; then
            V=$(git diff-tree --first-parent --no-commit-id -p -r "$MERGE_SHA" 2>/dev/null | python3 - <<'PYEOF' || true
          import re, sys
          cur = None; files = set(); added = {}
          for ln in sys.stdin:
              m = re.match(r"^diff --git a/(\S+) b/(\S+)", ln)
              if m:
                  cur = m.group(2)
                  if cur.startswith(".changes/") or cur == "CHANGELOG.md" \
                     or cur == "release_history.jsonl":
                      cur = None
                  elif cur:
                      files.add(cur)
                  continue
              if cur and ln.startswith("+") and not ln.startswith("+++"):
                  added.setdefault(cur, []).append(ln[1:])
          if len(files) == 1:
              f = next(iter(files))
              for line in added.get(f, []):
                  m = re.search(r"[0-9]+\.[0-9]+\.[0-9]+", line)
                  if m:
                      print(m.group(0)); break
          PYEOF
            )
          fi
          if [ "$V" != "$VER" ]; then
            echo "version source on merge reports '${V:-none}', tag is $TAG - refusing" >&2
            exit 1
          fi
          echo "finalizing release $TAG on merge commit $MERGE_SHA"
          git config user.name "ccsdd-release[bot]"
          git config user.email "ccsdd-release[bot]@users.noreply.github.com"
          # Idempotent finalization: a concurrent local repo_release.sh
          # run may already have published tag and/or release - either
          # is a win when it sits on THIS merge sha.
          git fetch origin --tags >/dev/null 2>&1 || true
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$MERGE_SHA" ]; then
              echo "tag $TAG exists on a different commit - conflict" >&2
              exit 1
            fi
            echo "tag $TAG already on $MERGE_SHA - skipping tag push"
          else
            git tag -a "$TAG" -m "release $TAG" "$MERGE_SHA"
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes
